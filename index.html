<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход • Instagram</title>
    <link rel="stylesheet" href="lab3/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="lab3/auth.js"></script>
    <script>
        // Уже вошёл (есть cookie) — сразу на страницу Instagram.
        if (Auth.currentUser()) {
            location.replace('profile.html');
        }
    </script>
</head>
<body>
    <main class="auth-page">
        <div class="auth-card">
            <h1 class="auth-logo">Instagram</h1>
            <p class="auth-subtitle">Войдите, чтобы открыть профиль</p>

            <div id="notice" class="alert alert-info" hidden></div>
            <div id="form-error" class="alert alert-error" hidden></div>

            <form id="login-form" class="auth-form" action="index.html" method="post"
                  data-success="profile.html" novalidate>
                <div class="field">
                    <input type="text" id="username" name="username" placeholder="Имя пользователя"
                           autocomplete="username" maxlength="20">
                    <small class="field-error"></small>
                </div>

                <div class="field">
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" placeholder="Пароль"
                               autocomplete="current-password" maxlength="32">
                        <button type="button" class="toggle-password" aria-label="Показать пароль">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <small class="field-error"></small>
                </div>

                <label class="remember">
                    <input type="checkbox" name="remember">
                    Запомнить меня (cookie на 7 дней)
                </label>

                <button type="submit" class="auth-btn">Войти</button>
            </form>

            <div class="divider"><span>ИЛИ</span></div>

            <p class="hint">
                Демо-аккаунт: <b>dinmukhamad</b> / <b>Lab3pass</b>
            </p>
        </div>

        <div class="auth-card auth-card-small">
            Lab 3 · GET + POST + Cookie + Validation · <a href="lab3/report.html">Отчёт</a>
        </div>
    </main>

    <script>
        // GET-параметры: сообщения (?logout=1, ?error=auth) и автозаполнение логина (?username=).
        const params = new URLSearchParams(location.search);
        const notice = document.getElementById('notice');

        if (params.has('logout')) {
            notice.textContent = 'Вы вышли из аккаунта.';
            notice.hidden = false;
        } else if (params.get('error') === 'auth') {
            notice.textContent = 'Сначала войдите в аккаунт.';
            notice.hidden = false;
        }

        const remembered = Auth.rememberedUser();
        document.getElementById('username').value = params.get('username') ?? remembered ?? '';
        document.querySelector('input[name=remember]').checked = remembered !== null;
    </script>
    <script src="lab3/login.js"></script>
</body>
</html>
